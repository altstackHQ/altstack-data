name: '🔄 Sentinel: Sync to thealtstack'

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'docker-deploy/**'
  workflow_dispatch:
    inputs:
      force_mirror:
        description: 'Bypass the community-data guard and mirror unconditionally (use only after manual review)'
        type: boolean
        default: false

jobs:
  sync:
    if: "!contains(github.event.head_commit.message, 'Sentinel: Synchronization from')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 📥 Checkout altstack-data (source)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: source-repo

      - name: 📥 Manual Checkout thealtstack (target)
        run: |
          echo "🔍 Sentinel: Running Auth Health Check..."
          if [ -z "${{ secrets.GH_PAT }}" ]; then
            echo "❌ ERROR: GH_PAT secret is missing in this repository!"
            exit 1
          fi
          
          # Try to clone with error trapping
          if ! git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/aa-humaaan/thealtstack.git target-repo; then
            echo "--------------------------------------------------------------------------------"
            echo "❌ CRITICAL: AUTHENTICATION FAILURE (403/401)"
            echo "Aditya, the 'GH_PAT' secret in this repository is invalid or lacks permissions."
            echo "FIX: Refresh your Personal Access Token with 'repo' scope and update it in:"
            echo "https://github.com/altstackHQ/altstack-data/settings/secrets/actions"
            echo "--------------------------------------------------------------------------------"
            exit 1
          fi
          
          cd target-repo
          git checkout main

      - name: '🛡️ Sentinel: Guard — never overwrite unreviewed content in either direction'
        run: |
          set -euo pipefail
          FORCE="${{ github.event.inputs.force_mirror || 'false' }}"
          if [ "$FORCE" = "true" ]; then
            echo "⚠️ Sentinel Guard: force_mirror=true — guard bypassed by explicit manual override."
            exit 0
          fi

          echo "🔎 Sentinel Guard: validating source catalog JSON..."
          if ! jq empty source-repo/data/tools.json; then
            echo "⛔ ABORT: source data/tools.json is not valid JSON. Refusing to publish."
            exit 1
          fi

          echo "🔎 Sentinel Guard: comparing every copied path (data/, docker-deploy/)..."
          SRC_DATA=$(git -C source-repo rev-parse 'HEAD:data' 2>/dev/null || echo 'ABSENT')
          TGT_DATA=$(git -C target-repo rev-parse 'HEAD:data' 2>/dev/null || echo 'ABSENT')
          SRC_DD=$(git -C source-repo rev-parse 'HEAD:docker-deploy' 2>/dev/null || echo 'ABSENT')
          TGT_DD=$(git -C target-repo rev-parse 'HEAD:docker-deploy' 2>/dev/null || echo 'ABSENT')
          echo "   data/ trees:          source=${SRC_DATA} target=${TGT_DATA}"
          echo "   docker-deploy/ trees: source=${SRC_DD} target=${TGT_DD}"

          if [ "$SRC_DATA" = "$TGT_DATA" ] && [ "$SRC_DD" = "$TGT_DD" ]; then
            echo "✅ Sentinel Guard: all copied paths already identical — overwriting cannot lose anything."
            exit 0
          fi

          SRC_BLOB=$(git -C source-repo rev-parse 'HEAD:data/tools.json')
          TGT_BLOB=$(git -C target-repo rev-parse 'HEAD:data/tools.json')
          echo "   source tools.json blob: ${SRC_BLOB}"
          echo "   target tools.json blob: ${TGT_BLOB}"

          echo "🔎 Sentinel Guard: verifying no destination-side file would be deleted or silently overwritten..."
          if ! git -C target-repo ls-tree -r --name-only HEAD -- data docker-deploy >/dev/null; then
            echo "⛔ ABORT: could not enumerate target files under data/ and docker-deploy/."
            exit 1
          fi
          DELETIONS=""
          OVERWRITES=""
          while IFS= read -r -d '' tpath; do
            tgt_blob=$(git -C target-repo rev-parse "HEAD:${tpath}")
            if src_blob=$(git -C source-repo rev-parse "HEAD:${tpath}" 2>/dev/null); then
              if [ "$src_blob" = "$tgt_blob" ]; then
                continue
              fi
              SAFE_FILE=false
              for sha in $(git -C source-repo rev-list HEAD -- "$tpath"); do
                blob=$(git -C source-repo rev-parse "${sha}:${tpath}" 2>/dev/null) || continue
                if [ "$blob" = "$tgt_blob" ]; then
                  SAFE_FILE=true
                  echo "   ✅ ${tpath} matches source revision ${sha} — target is strictly behind."
                  break
                fi
              done
              if [ "$SAFE_FILE" != "true" ]; then
                OVERWRITES="${OVERWRITES}${tpath}"$'\n'
              fi
            else
              DELETIONS="${DELETIONS}${tpath}"$'\n'
            fi
          done < <(git -C target-repo ls-tree -r -z --name-only HEAD -- data docker-deploy)

          if [ -n "$DELETIONS" ]; then
            echo "⛔ ABORT: this sync would delete files that exist in the target but not in the source:"
            printf '%s' "$DELETIONS" | sed 's/^/   - /'
            echo "   If these deletions are intentional, re-run via workflow_dispatch with force_mirror=true (or have a maintainer update this guard)."
            exit 1
          fi

          if [ -n "$OVERWRITES" ]; then
            echo "⛔ ABORT: the target repo holds content that never existed in the source history:"
            printf '%s' "$OVERWRITES" | sed 's/^/   - /'
            echo "   Overwriting it would silently discard reviewed changes. Manual review required."
            exit 1
          fi

          echo "🔎 Sentinel Guard: checking for catalog entries this sync would delete..."
          LOST=$(jq -n --slurpfile t target-repo/data/tools.json --slurpfile s source-repo/data/tools.json '($t[0] | map(.slug)) - ($s[0] | map(.slug))')
          if [ "$LOST" != "[]" ]; then
            echo "⛔ ABORT: this sync would delete catalog entries present in the target:"
            echo "$LOST"
            echo "   If these deletions are intentional, re-run via workflow_dispatch with force_mirror=true (or have a maintainer update this guard)."
            exit 1
          fi

          echo "✅ Sentinel Guard: passed — source is a reviewed advance of the target and deletes nothing. Proceeding."


      - name: 🔄 Copy data and docker-deploy
        run: |
          mkdir -p target-repo/data target-repo/docker-deploy
          
          rsync -av --delete source-repo/data/ target-repo/data/
          rsync -av --delete source-repo/docker-deploy/ target-repo/docker-deploy/

      - name: '📤 Sentinel: Push updates to thealtstack'
        run: |
          cd target-repo
          # Vercel refuses to deploy a commit whose author email is not linked to a
          # GitHub account. sentinel@thealtstack.com was not, so every synced change
          # silently left production serving the previous build (42210cad and
          # ef2c26ee both report "Vercel: failure Deployment was blocked"). The
          # github-actions[bot] noreply address was verified accepted on 2026-10-14
          # by pushing a commit under exactly this identity and watching the
          # deployment complete. The display name still says Sentinel, because it is.
          SYNC_AUTHOR_NAME="${SYNC_AUTHOR_NAME:-Sovereign Sentinel (AI)}"
          SYNC_AUTHOR_EMAIL="${SYNC_AUTHOR_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
          case "$SYNC_AUTHOR_EMAIL" in
            *@users.noreply.github.com|*@noreply.github.com) ;;
            *)
              echo "::error::author email $SYNC_AUTHOR_EMAIL is not linked to a GitHub account - syncing with it would leave the site on the previous build"
              exit 1;;
          esac
          git config user.name "$SYNC_AUTHOR_NAME"
          git config user.email "$SYNC_AUTHOR_EMAIL"
          git add data/ docker-deploy/
          
          if git diff --staged --quiet; then
            echo "💤 Sentinel: Dataset remains optimal. No sync required."
            exit 0
          fi
          
          git commit -m "🤖 Sentinel: Synchronization from altstackHQ/altstack-data"
          git push origin main
