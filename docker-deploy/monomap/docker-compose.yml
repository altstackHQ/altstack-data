version: '3.8'

services:
  monomap:
    image: ghcr.io/tehnika-mk/monomap:latest
    container_name: monomap
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # No volume: maps and boards live in each visitor's browser (IndexedDB),
    # so this container is stateless.
